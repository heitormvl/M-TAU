name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_API_NAME: mtau-api
  AZURE_WEBAPP_CLIENT_NAME: mtau-client
  DOTNET_VERSION: '10.0.x'

jobs:
  deploy-api:
    name: Deploy API to Azure App Service
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish M-TAU.API/M-TAU.API.csproj -c Release -o publish-api /p:UseAppHost=false

      - name: Deploy to Azure App Service (API)
        if: env.AZURE_API_PUBLISH_PROFILE != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_API_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: publish-api
        env:
          AZURE_API_PUBLISH_PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}

  deploy-client:
    name: Deploy Client (Blazor WASM)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Client
        run: dotnet publish M-TAU.Client/M-TAU.Client.csproj -c Release -o publish-client

      - name: Deploy to Azure Static Web App
        if: env.AZURE_SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish-client/wwwroot
          skip_app_build: true
        env:
          AZURE_SWA_TOKEN: ${{ secrets.AZURE_SWA_TOKEN }}
