name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore M-TAU.slnx

      - name: Build
        run: dotnet build M-TAU.slnx --configuration Release --no-restore

      - name: Test
        run: |
          if [ -d "M-TAU.Tests" ]; then
            dotnet test M-TAU.Tests/M-TAU.Tests.csproj --configuration Release --no-build --verbosity normal
          else
            echo "No test project found, skipping."
          fi
