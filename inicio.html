<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M-TAU | Início - Marketplace de Tecnologias Assistivas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <style>
      /* Variáveis de Alto Contraste e Acessibilidade */
      :root {
        --primary-color: #004b87; /* Azul escuro com alto contraste */
        --secondary-color: #f8f9fa;
        --text-color: #212529;
        --focus-color: #ffc107; /* Amarelo de alto contraste para o outline */
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-color);
        background-color: var(--secondary-color);
      }

      /* Hit Targets (Áreas de Clique) - Mínimo 44x44px para acessibilidade motora (Persona 01) */
      .hit-target {
        min-height: 48px;
        min-width: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Foco Acessível para Navegação via Teclado */
      a:focus,
      button:focus,
      input:focus,
      select:focus {
        outline: 4px solid var(--focus-color) !important;
        outline-offset: 2px !important;
        box-shadow: none !important;
      }

      /* Estilização Customizada de Componentes */
      .navbar-custom {
        background-color: var(--primary-color);
      }

      .navbar-custom .navbar-brand,
      .navbar-custom .nav-link {
        color: #ffffff;
        font-weight: 600;
      }

      .hero-section {
        background-color: #ffffff;
        border-bottom: 2px solid #dee2e6;
        padding: 4rem 0;
      }

      .search-container {
        max-width: 800px;
        margin: 0 auto;
      }

      .category-card {
        border: 2px solid #dee2e6;
        border-radius: 8px;
        transition: all 0.2s ease-in-out;
        background-color: #ffffff;
        color: var(--primary-color);
        text-decoration: none;
        padding: 2rem 1rem;
      }

      .category-card:hover {
        border-color: var(--primary-color);
        background-color: #e9ecef;
        color: var(--primary-color);
      }

      .category-icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-expand navbar-custom py-3"
        aria-label="Navegação Principal"
      >
        <div class="container">
          <a
            class="navbar-brand hit-target"
            href="#"
            aria-label="Ir para a página inicial do M-TAU"
          >
            <i class="fa-solid fa-wheelchair-move me-2" aria-hidden="true"></i>
            M-TAU
          </a>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link hit-target px-3"
                href="#"
                aria-label="Acessar sua conta"
                >Entrar</a
              >
            </li>
            <li class="nav-item">
              <a
                class="btn btn-light text-primary fw-bold hit-target px-4 ms-2"
                href="#"
                aria-label="Criar um novo anúncio"
                >Anunciar</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main id="conteudo-principal">
      <section
        class="hero-section text-center px-3"
        aria-labelledby="titulo-principal"
      >
        <div class="container search-container">
          <h1 id="titulo-principal" class="display-5 fw-bold mb-3 text-dark">
            Encontre Tecnologias Assistivas com Segurança
          </h1>
          <p class="lead mb-5 text-secondary">
            Marketplace especializado, seguro e com descrições técnicas
            detalhadas para garantir sua autonomia.
          </p>

          <form
            class="d-flex flex-column flex-md-row gap-2"
            action="#"
            role="search"
          >
            <div class="flex-grow-1">
              <label for="campo-busca" class="visually-hidden"
                >O que você está procurando?</label
              >
              <input
                type="search"
                id="campo-busca"
                class="form-control form-control-lg hit-target"
                placeholder="Ex: Cadeira de rodas monobloco, Muleta canadense..."
                aria-label="Digite o equipamento que procura"
              />
            </div>
            <button
              class="btn btn-primary btn-lg hit-target px-5"
              type="submit"
              aria-label="Buscar equipamentos"
            >
              <i
                class="fa-solid fa-magnifying-glass me-2"
                aria-hidden="true"
              ></i
              >Buscar
            </button>
          </form>
        </div>
      </section>

      <section class="container py-5" aria-labelledby="titulo-categorias">
        <h2 id="titulo-categorias" class="h3 mb-4 text-center fw-bold">
          Busca Rápida por Categoria
        </h2>

        <div class="row g-4 text-center">
          <div class="col-6 col-md-3">
            <a
              href="#"
              class="category-card d-block hit-target w-100"
              aria-label="Buscar produtos para Deficiência Física"
            >
              <i
                class="fa-solid fa-person-walking-with-cane category-icon"
                aria-hidden="true"
              ></i>
              <h3 class="h5 m-0">Física / Motora</h3>
            </a>
          </div>
          <div class="col-6 col-md-3">
            <a
              href="#"
              class="category-card d-block hit-target w-100"
              aria-label="Buscar produtos para Deficiência Visual"
            >
              <i
                class="fa-solid fa-eye-low-vision category-icon"
                aria-hidden="true"
              ></i>
              <h3 class="h5 m-0">Visual</h3>
            </a>
          </div>
          <div class="col-6 col-md-3">
            <a
              href="#"
              class="category-card d-block hit-target w-100"
              aria-label="Buscar produtos para Deficiência Auditiva"
            >
              <i
                class="fa-solid fa-ear-deaf category-icon"
                aria-hidden="true"
              ></i>
              <h3 class="h5 m-0">Auditiva</h3>
            </a>
          </div>
          <div class="col-6 col-md-3">
            <a
              href="#"
              class="category-card d-block hit-target w-100"
              aria-label="Buscar produtos para Deficiência Cognitiva"
            >
              <i class="fa-solid fa-brain category-icon" aria-hidden="true"></i>
              <h3 class="h5 m-0">Cognitiva</h3>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white py-4 mt-5 text-center">
      <div class="container">
        <p class="mb-0">
          &copy; 2026 M-TAU. Todos os direitos
          reservados.
        </p>
      </div>
    </footer>
  </body>
</html>
